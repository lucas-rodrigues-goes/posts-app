<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Publicações</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Tela de Login -->
        <div id="login-screen" class="screen active">
            <div class="login-container">
                <h1>Sistema de Publicações</h1>
                <form id="login-form">
                    <div class="form-group">
                        <label for="username">Usuário:</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Senha:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <button type="submit">Entrar</button>
                </form>
                <div id="login-message" class="message"></div>
                <p>Não tem uma conta? <a href="#" id="show-register">Registre-se aqui</a></p>
            </div>
        </div>

        <!-- Tela de Registro -->
        <div id="register-screen" class="screen">
            <div class="login-container">
                <h1>Registro</h1>
                <form id="register-form">
                    <div class="form-group">
                        <label for="reg-username">Usuário:</label>
                        <input type="text" id="reg-username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Senha:</label>
                        <input type="password" id="reg-password" name="password" required>
                    </div>
                    <button type="submit">Registrar</button>
                </form>
                <div id="register-message" class="message"></div>
                <p>Já tem uma conta? <a href="#" id="show-login">Entre aqui</a></p>
            </div>
        </div>

        <!-- Tela de Publicações -->
        <div id="posts-screen" class="screen">
            <header class="header">
                <h1>Publicações</h1>
                <button id="logout-btn" class="logout-btn">Sair</button>
            </header>
            
            <div class="container">
                <!-- Criar Nova Publicação -->
                <div class="create-post">
                    <h2>Criar Nova Publicação</h2>
                    <form id="create-post-form">
                        <div class="form-group">
                            <label for="post-title">Título:</label>
                            <input type="text" id="post-title" name="title" required>
                        </div>
                        <div class="form-group">
                            <label for="post-text">Conteúdo:</label>
                            <textarea id="post-text" name="text" rows="4" required></textarea>
                        </div>
                        <button type="submit">Criar Publicação</button>
                    </form>
                </div>

                <!-- Lista de Publicações -->
                <div class="posts-list">
                    <h2>Todas as Publicações</h2>
                    <div id="posts-container"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
